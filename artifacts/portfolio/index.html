<!DOCTYPE html>
<html lang="en">

    <meta charset="UTF-8" />

    <meta name="robots" content="index, follow" />
    <meta name="referrer" content="no-referrer" />
    <meta property="og:title" content="Portfolio" />
    <meta property="og:description" content="Portfolio — built on Replit. Update this description to reflect the app." />
    <meta property="og:type" content="website" />

    <meta name="twitter:title" content="Portfolio" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <!--
      Inject the API base URL before any user scripts run.
      Replit Reserved VM was deprecated in 2025; the new backend is on Railway
      at https://api-server-production-676d.up.railway.app. public/scripts/app-config.js
      reads `window.APP_CONFIG.API_BASE_URL` as the first candidate and probes
      `${candidate}/api/healthz`, so this single line bypasses the Vercel
      rewrite (which is currently broken on this monorepo) and avoids the
      need to push the URL through every page's call site.
    -->
    <script>
      window.APP_CONFIG = Object.assign({}, window.APP_CONFIG, {
        API_BASE_URL: 'https://api-server-production-676d.up.railway.app',
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
